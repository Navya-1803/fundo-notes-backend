# test configuration: H2 in-memory database instead of MySQL
spring.application.name=fundoo-notes
spring.datasource.url=jdbc:h2:mem:fundoo_notes_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=FundooNotesTestSecretKeyThatIsLongEnough123456
app.jwt.expiration-ms=3600000
# no message broker in tests, listeners are not created
app.messaging.listeners-enabled=false
app.jms.user-registration-queue=user.registration.queue
spring.jms.listener.auto-startup=false
app.rabbitmq.reminder-queue=reminder.queue
app.rabbitmq.reminder-exchange=notes.exchange
app.rabbitmq.reminder-routing-key=reminder.created
spring.rabbitmq.listener.simple.auto-startup=false
app.redis.otp-expiration=300
app.redis.token-expiration=3600
# in-memory cache in tests instead of Redis
spring.cache.type=simple
spring.batch.job.enabled=false
app.batch.trash-retention-days=30
